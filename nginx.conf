server {
  listen 80;
  server_name localhost;

  # The root where Vite build files exist
  root /usr/share/nginx/html;
  index index.html;

  # Handle /portfolio/* requests correctly
  location /portfolio/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
  }

  # Handle direct route refreshes (SPA fallback)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional logging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
}
